<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){try{var t=localStorage.getItem("vc_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>VICE CUT AI</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=vc4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@300&family=Archivo+Black&family=Anton&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#FF2E93;--brand-press:#E01174;--brand-ink:#FFFFFF;--brand-soft:rgba(255,46,147,.22);--brand-line:rgba(255,98,176,.52);--brand-deep:#52F7E6;
  --ai:#36E2D0;--ai-soft:rgba(54,226,208,.20);--neural:#7B4DFF;
  --frame:#06040F;--frame-2:rgba(255,255,255,.09);--frame-line:rgba(255,255,255,.13);--frame-text:#FFFFFF;--frame-dim:#D4CEE8;
  --bg:#090614;--surface:rgba(24,18,46,.76);--muted:rgba(37,28,68,.72);--line:rgba(255,255,255,.13);--line-2:rgba(255,255,255,.22);
  --text:#FFFFFF;--dim:#E0DBF2;--faint:#B8B0D2;
  --good:#46F2DF;--good-soft:rgba(54,226,208,.20);--bad:#FF8096;--bad-soft:rgba(255,56,92,.24);--live:#FF2A54;
  --glass-blur:blur(26px) saturate(195%);--mat-blur:blur(18px) saturate(165%);
  --r-lg:20px;--r:14px;--r-sm:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--text);font:14px/1.5 "Geist","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none;fill:currentColor}
::selection{background:var(--brand-line)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2D234E;border-radius:999px;border:3px solid #0C0918}

/* ---------- frame */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100vh}
.side{background:var(--frame);color:var(--frame-text);display:flex;flex-direction:column;height:100vh;padding:14px 10px 12px;min-width:0}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 22px 6px}
.side-head .logo{height:36px;width:auto;display:block}
.side-head .mark{display:none;width:34px;height:34px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);border:0;background:transparent;color:var(--dim);cursor:pointer;flex:none}
.side .icon-btn{color:var(--frame-dim)}
.icon-btn:active{background:var(--muted)}.side .icon-btn:active{background:var(--frame-2)}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav h4{font-size:12px;font-weight:500;color:var(--frame-dim);padding:14px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 10px;border-radius:7px;border:0;background:transparent;color:var(--frame-text);font-size:14px;font-weight:500;cursor:pointer;text-align:left}
.nav-item svg{width:17px;height:17px}
.nav-item svg{color:var(--frame-dim)}
.nav-item:active{background:var(--frame-2)}
.nav-item.on{background:var(--brand);color:#FFFFFF;font-weight:600}
.nav-item.on svg{color:#FFFFFF}
.label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--frame-text);white-space:nowrap}
.nav-item.on .count{background:rgba(7,5,16,.28);color:#FFFFFF}
.avatar{width:26px;height:26px;border-radius:50%;background:rgba(255,46,147,.2);color:#FF7AC4;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;overflow:hidden}
img.avatar{object-fit:cover;background:rgba(255,255,255,.08)}
.tav{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--muted)}
#title{display:flex;align-items:center;gap:10px}
.chprev{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);animation:rise .25s ease both}
.chprev img,.chprev .ph{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:#221A3A}
.chprev b{display:block;font-size:14px;color:var(--brand-ink)}
.chprev span{font-size:12px;color:var(--faint)}
.chprev.bad{background:var(--bad-soft);color:#FF8DA1;font-size:13px}
.chprev .sk{width:120px}
.nav-item.on .avatar{background:#070510;color:#36E2D0}
.nav-item.on img.avatar{background:#070510}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.3s infinite;flex:none}
.side-foot{display:flex;flex-direction:column;gap:2px;padding-top:12px;border-top:1px solid var(--frame-line)}
.side-card{background:var(--frame-2);border-radius:var(--r);padding:12px 14px;margin-top:8px;font-size:12px;color:var(--frame-dim);display:flex;flex-direction:column;gap:7px}
.side-card div{display:flex;align-items:center;gap:9px}
.led{width:7px;height:7px;border-radius:50%;background:#36E2D0;flex:none}.led.no{background:#FF4D6A}.led.mid{background:var(--brand)}
.plans-btn{margin-top:10px;width:100%;background:var(--brand);color:#FFFFFF;border:0}
.scrim{display:none}

main{background:var(--bg);margin:8px 8px 8px 0;border-radius:var(--r-lg);height:calc(100vh - 16px);overflow-y:auto;min-width:0;scrollbar-gutter:stable}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 28px;min-height:54px;border-bottom:1px solid transparent;transition:border-color .2s ease}
.topbar.stuck{border-color:var(--line)}
#vbanner:empty{display:none}
.upd{display:grid;gap:14px}
.upd ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;color:var(--text);max-height:180px;overflow:auto}
.upd ul small{color:var(--dim)}
.upd .cmd{display:flex;gap:8px;align-items:center}
.upd .cmd code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;background:var(--muted);border-radius:8px;padding:9px 11px}
.upd h3{font-size:13px;font-weight:600;color:var(--brand-ink);margin:0}
.vb{display:flex;align-items:center;gap:12px;margin:12px 28px 0;padding:12px 12px 12px 16px;border-radius:12px;background:rgba(110,57,246,.18);border:1px solid rgba(54,226,208,.3);color:#E5DEFF;font-size:14px;animation:rise .3s ease both}
.vb svg{width:18px;height:18px;flex:none;color:var(--brand-deep)}
.vb span{flex:1;min-width:0}
.vb b{color:#36E2D0}
@media (max-width:640px){.vb{margin:10px 16px 0;flex-wrap:wrap}}
.topbar .titles{flex:1;min-width:0}
#tpic:empty{display:none}
#tpic img,#tpic .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;font-size:15px}
#tpic span.avatar{background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700}
#tpic.live img,#tpic.live .avatar{padding:2px;background:var(--surface);border:2px solid var(--live)}
.topbar.tabbed{border-color:var(--line)}
.topbar.tabbed .titles{flex:0 1 auto;max-width:34%}
.topbar.tabbed #actions{margin-left:auto}
.utabs:empty{display:none}
.utabs{display:flex;gap:2px;padding:3px;background:var(--muted);border-radius:11px;overflow-x:auto;scrollbar-width:none}
@media (min-width:761px){.topbar.tabbed{position:sticky}.topbar.tabbed .utabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}.topbar.tabbed .titles{max-width:calc(50% - 275px)}}
@media (max-width:760px){.utabs{order:5;flex-basis:100%;margin:2px 0 0;position:relative}.topbar.tabbed .titles{max-width:none;flex:1}}
.utabs .tabbtn{height:34px;padding:0 14px;border-radius:8px;background:transparent;color:var(--dim);font-size:13px;transition:background-color .18s ease,color .18s ease}
.utabs .tabbtn:hover{background:#231B3E;color:var(--text)}
.utabs .tabbtn::after{display:none}
.utabs .tabbtn.on{background:transparent;color:#FFFFFF}
.utabs .tabbtn{position:relative;z-index:1}
.utabs .ind{position:absolute;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--brand);z-index:0;transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}
.utabs .tabbtn,.utabs .tabbtn svg,.utabs .tabbtn .n{transition:color .25s ease,background-color .25s ease}
.utabs .tabbtn.on svg{color:#FFFFFF}
.utabs .tabbtn .n{background:var(--muted);color:var(--dim)}
.utabs .tabbtn.on .n{background:rgba(7,5,16,.28);color:#FFFFFF}
.rdot{flex:none;width:9px;height:9px;border-radius:50%;background:#fff}
.btn .rdot.on{background:#E5323F;animation:pulse 1.3s infinite}
/* live stream panel */
.stream{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:14px;background:#110C22;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:22px;color:#F5F0FF;animation:rise .3s ease both}
.stream .player{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.stream iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.noembed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:#080512;color:#F5F0FF}
.noembed .logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:4px}
.noembed .logo svg{width:22px;height:22px}
.noembed b{font-size:15px;color:#fff}
.noembed span{font-size:13px;color:var(--dim);max-width:380px}
.noembed .btn{margin-top:6px}
.sinfo{display:flex;flex-direction:column;gap:12px;padding:6px 6px 4px 2px;min-width:0}
.sinfo .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sinfo .logo{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.sinfo .logo svg{width:16px;height:16px}
.sinfo .lv{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:#E5323F;color:#fff;padding:3px 10px;border-radius:999px}
.sinfo .lv i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
.sinfo h3{font-size:16px;line-height:1.4;font-weight:600;color:#fff;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sinfo .by{font-size:12px;color:var(--dim);margin-top:-6px}
.sstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
.sstats div{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px}
.sstats b{display:block;font-size:17px;font-weight:700;color:#fff;letter-spacing:-.01em}
.sstats span{font-size:11px;color:var(--dim)}
.sinfo .cta{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sinfo .cta .btn{height:46px;width:100%;justify-content:center;font-size:15px}
.sinfo .cta small{font-size:12px;color:var(--dim);text-align:center}
.splat{display:flex;gap:4px;margin-left:auto}
.splat button{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:8px;background:rgba(255,255,255,.06);color:var(--dim);cursor:pointer;transition:background-color .15s ease}
.splat button:hover{background:rgba(255,255,255,.12)}
.splat button.on{background:rgba(255,46,147,.28);color:#fff}
.splat svg{width:15px;height:15px}
@media (max-width:960px){.stream{grid-template-columns:1fr}}
.sbadge{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;background:var(--muted);color:var(--dim)}
.sbadge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.sbadge.live{background:var(--bad-soft);color:#FF6B84}.sbadge.live i,.sbadge.rec i{animation:pulse 1.3s infinite}
.sbadge.rec{background:#E5323F;color:#fff}
.sbadge svg{width:12px;height:12px}
.sbadge{white-space:nowrap;max-width:100%}
.topbar .titles{overflow:hidden}
@media (max-width:560px){#tpic img,#tpic .avatar{width:36px;height:36px}.topbar #actions .btn[data-act=golive]{font-size:0;gap:0;width:38px;padding:0;justify-content:center}.topbar #actions .btn[data-act=golive] .rdot{width:12px;height:12px}}
.ttabs{display:inline-flex;gap:2px;padding:3px;background:var(--muted);border-radius:10px}
.ttabs .tabbtn{height:32px;padding:0 12px;border-radius:8px;font-size:13px;color:var(--dim)}
.ttabs .tabbtn::after{display:none}
.ttabs .tabbtn svg{width:16px;height:16px}
.ttabs .tabbtn:hover{background:#231B3E;color:var(--text)}
.ttabs .tabbtn.on{background:var(--brand-soft);color:var(--brand-ink)}
.ttabs .tabbtn.on .n{background:var(--surface)}
#actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#actions a.btn{text-decoration:none}
@media (max-width:560px){#actions .btn .long{display:none}}
@media (max-width:900px){.ttabs .tabbtn .lbl{display:none}.ttabs .tabbtn{padding:0 10px}}
/* channels in Setup */
.chans{display:flex;flex-direction:column;gap:8px}
.chan{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--muted);min-height:64px}
.chan .logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.chan .logo svg{width:20px;height:20px}
.chan .pic{flex:none;width:40px;height:40px;border-radius:50%;object-fit:cover;background:#221A3A}
.chan .who{flex:1;min-width:0}
.chan .who b{display:block;font-size:14px;color:var(--brand-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan .who span{font-size:12px;color:var(--faint)}
.chan input{flex:1;min-width:0}
.chan .main{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap}
.chan .main input{accent-color:var(--brand);width:15px;height:15px;flex:none}
.chan .sbadge{margin:0}
@media (max-width:640px){.chan{flex-wrap:wrap}.chan .main{order:5}}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--brand-ink)}
.topbar p{font-size:12px;color:var(--dim);margin-top:0;overflow-wrap:anywhere}
.icon-btn.menu{display:none}
.content{padding:28px 32px 72px;max-width:1280px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}

/* ---------- collapsed sidebar */
.app.mini{grid-template-columns:76px minmax(0,1fr)}
.app.mini .side-head{flex-direction:column;padding:2px 0 18px}
.app.mini .side-head .logo{display:none}.app.mini .side-head .mark{display:block}
.app.mini .label,.app.mini .count,.app.mini .nav h4,.app.mini .side-card,.app.mini .plans-btn{display:none}
.app.mini .nav-item{justify-content:center;padding:0}
.app.mini .nav-item .live-dot{position:absolute;margin:-20px -22px 0 0}
.avatar.ring{border:2px solid #E5323F;padding:1px;background-clip:content-box}
img.avatar.ring{background:transparent}
.sb-tag{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#FF8A8A;background:rgba(229,50,63,.16);padding:1px 7px 1px 6px;border-radius:5px}
.sb-tag i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
.sb-tag.rec{background:#E5323F;color:#fff}
.nav-item.on .sb-tag{background:#E5323F;color:#fff}
.app.mini .sb-tag{display:none}

/* ---------- buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap;font-weight:600}
.btn:active{background:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#FFFFFF}
.btn.primary:active{background:var(--brand-press);border-color:var(--brand-press)}
.btn.dark{background:#1D1536;border-color:var(--line-2);color:#FFFFFF}
.btn.dark svg{color:var(--brand)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;gap:6px}
.btn.sm svg{width:16px;height:16px}
.btn.icon{width:32px;padding:0}
.btn.lg{height:44px;padding:0 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

/* ---------- fields */
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea){width:100%;height:40px;padding:0 12px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);min-width:0;outline:none;transition:border-color .15s ease}
:where(textarea){height:auto;padding:10px 12px;resize:vertical}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):hover{border-color:#4B3B7C}
:where(input:not([type=checkbox],[type=radio],[type=file],[type=range]),select,textarea):focus{background:#17112B;border-color:var(--brand)}
input:not([type=checkbox],[type=radio],[type=range]):focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
label.f{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--dim);font-weight:600}
label.sw{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--text);font-weight:600}
label.sw input{appearance:none;width:38px;height:22px;border-radius:999px;background:#2C224B;position:relative;cursor:pointer;flex:none;margin:0}
label.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
label.sw input:checked{background:var(--brand)}label.sw input:checked::after{transform:translateX(16px)}
label.sw small{display:block;color:var(--dim);font-size:12px;font-weight:400}
label.ck{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:var(--r);cursor:pointer;background:var(--surface);border:1px solid var(--line-2);font-weight:500}
label.ck:has(input:checked){background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
label.ck input{accent-color:var(--brand);margin:0}
[data-caption-style]:disabled{opacity:.45;cursor:default}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.span{grid-column:1/-1}

/* ---------- surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.card>h2,.card-head h2{font-size:15px;font-weight:600;color:var(--brand-ink)}
.card>h2{margin-bottom:4px}
.card>h2+.help{margin-bottom:18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.help,.sub{color:var(--dim);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabbtn{position:relative;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;border:0;background:transparent;color:var(--faint);cursor:pointer;font-weight:600;font-size:14px;border-radius:10px 10px 0 0;white-space:nowrap}
.tabbtn svg{width:17px;height:17px}
.tabbtn .n{font-size:11px;font-weight:600;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--muted);color:var(--dim);text-align:center;transition:background-color .15s ease,color .15s ease}
.tabbtn::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand);opacity:0}
.tabbtn.on{color:var(--brand-ink)}
.tabbtn.on::after{opacity:1;animation:tabin .28s ease}
.tabbtn.on .n{background:var(--brand-soft);color:var(--brand-ink)}
.tabbtn.on svg{color:var(--brand)}
@keyframes tabin{from{transform:scaleX(.3);opacity:0}to{transform:none;opacity:1}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--muted);color:var(--dim);white-space:nowrap;text-decoration:none}
.pill svg{width:14px;height:14px}
.pill.ok{color:var(--good);background:var(--good-soft)}
a.pill.ok:hover{background:rgba(54,226,208,.24)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}

.hint{font-size:12px;color:var(--faint);margin-right:6px}

.ai-mchip{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--brand-ink);cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.ai-mchip:hover,.ai-mchip:focus-visible{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep)}
.ai-alert{max-width:560px;margin:0 0 16px;padding:12px 14px;border-radius:10px;border:1px solid var(--line-2);display:grid;gap:6px;font-size:13px;line-height:1.45}
.ai-alert.bad{background:var(--bad-soft);border-color:rgba(255,77,106,.45);color:#FFB3C1}
.ai-alert.warn{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.ai-alert-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ai-alert-top b{font-weight:600}
.btn-spin{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .75s linear infinite;flex:none}
.ai-prog{margin:10px 0 14px;max-width:560px;padding:12px 14px;border-radius:10px;background:var(--brand-soft);border:1px solid var(--brand);display:grid;gap:8px}
.ai-prog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:600;color:var(--brand-ink)}
.ai-prog-head>span{display:inline-flex;align-items:center;gap:8px;min-width:0}
.ai-prog-head b{font-variant-numeric:tabular-nums;color:var(--brand-deep);white-space:nowrap}
.ai-prog .bar{margin:0;background:rgba(42,26,18,.12)}
.ai-chk.testing{border-color:var(--brand);background:rgba(255,46,147,.08)}
.set-sec{padding:0 0 26px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.set-sec:last-child{border-bottom:0}
.set-sec h2{font-size:17px;color:var(--brand-ink);margin-bottom:4px}
.set-sec .help{margin-bottom:16px}
.set-load{padding:40px 0;color:var(--faint)}
.fields.narrow{max-width:420px;grid-template-columns:1fr}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.prof-pic{width:56px;height:56px;font-size:22px;border-radius:50%;object-fit:cover;color:#fff}
.prof b{display:block;font-size:16px;color:var(--brand-ink)}.prof span{font-size:13px;color:var(--dim)}
.kv{margin:0 0 12px;border-top:1px solid var(--line)}
.kv div{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv dt{font-size:13px;color:var(--dim)}.kv dd{margin:0;font-size:14px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.apps{display:flex;flex-direction:column;gap:10px}
.appcard{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.applogo{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.applogo svg{width:22px;height:22px}
.apptx{flex:1;min-width:0}.apptx>b{display:block;font-size:15px;color:var(--brand-ink)}.apptx>span{font-size:13px;color:var(--dim)}
.appact{flex:none}
.appcard{flex-wrap:wrap}
.stor-path{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stor-path code{flex:1 1 260px;min-width:0;overflow-wrap:anywhere;font-size:13px;background:var(--muted);border-radius:8px;padding:10px 12px}
.stor-bar{height:10px;border-radius:999px;background:var(--muted);overflow:hidden;margin:14px 0 6px}
.stor-bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.stor-bar.low i{background:var(--bad)}
.stor-nums{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.stor-change{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--muted);display:grid;gap:12px}
.stor-change .with{display:flex;gap:8px}.stor-change .with input{flex:1;min-width:0}
.appsetup{flex-basis:100%;margin-top:4px;padding:14px 16px;border-radius:10px;background:var(--muted);display:grid;gap:12px}
.appsetup ol{margin:0;padding-left:18px;font-size:13px;color:var(--text);display:grid;gap:4px}
.appsetup a{color:var(--brand-deep);font-weight:600}
.appsetup a:hover{color:var(--brand-ink)}
.appsetup .copyrow{display:flex;gap:8px;align-items:center}
.appsetup .copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.appsetup .warnline{font-size:12px;color:var(--brand-deep)}
.appact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.applist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.applist div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.applist .btn{margin-left:auto}
@media (max-width:860px){.set-layout{grid-template-columns:1fr;gap:16px}.set-nav{position:static;flex-direction:row;overflow-x:auto}.set-link small{display:none}.set-link{flex:none}.kv div{grid-template-columns:1fr;gap:2px}}
.savebar{position:sticky;bottom:16px;z-index:4;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;margin-top:8px;border-radius:14px;background:#1A1333;border:1px solid var(--brand-line);color:#FFFFFF;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.savebar.on{opacity:1;transform:none;pointer-events:auto}
.savebar>span{flex:1;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.savebar>span svg{width:16px;height:16px;color:var(--brand)}
.savebar .btn.ghost{color:#F4F0FF;background:transparent;border-color:transparent}
.savebar .btn.ghost:hover{background:rgba(255,255,255,.08)}
.step .n{width:26px;height:26px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;color:#36E2D0}
.step b{display:block;font-weight:600;color:var(--text)}
.step .d{font-size:12px;color:var(--dim)}
.step>svg{color:var(--faint);margin-left:auto}
.allset{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:var(--good-soft);color:var(--good);font-weight:600}

/* ---------- jobs + clips */
.job{margin-bottom:36px}
.job-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.jt{display:flex;gap:14px;align-items:center;min-width:0}
.jthumb{position:relative;flex:none;width:128px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--muted);display:grid;place-items:center;color:var(--faint)}
.jthumb img{width:100%;height:100%;object-fit:cover;display:block}
.jthumb>svg{width:22px;height:22px}
.jthumb .du{position:absolute;right:5px;bottom:5px;background:rgba(20,12,8,.82);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px}
@media (max-width:560px){.jthumb{width:92px}}
.job-head h3{font-size:15px;font-weight:600;overflow-wrap:anywhere;color:var(--brand-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:6px;background:var(--muted);border-radius:999px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .8s ease}
.err{color:var(--bad);font-size:13px;overflow-wrap:anywhere;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.shot{position:relative;aspect-ratio:9/16;background:#070510;border:0;padding:0;cursor:pointer;display:block;width:100%;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .veil{position:absolute;left:10px;bottom:10px}
.veil span{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:#FFFFFF}
.veil svg{width:15px;height:15px;margin-left:2px}
.badge{position:absolute;top:10px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:var(--r-sm);background:rgba(13,9,26,.88);color:var(--brand-ink)}
.badge.l{left:10px}.badge.r{right:10px}
.badge.s-hi{background:var(--brand);color:#FFFFFF}.badge.s-mid{background:#6E39F6;color:#FFFFFF}
.making{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--dim);font-size:13px;font-weight:500;background:linear-gradient(110deg,#120D22 30%,#1E1638 50%,#120D22 70%);background-size:220% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
.clip-body{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.hook{font-weight:600;font-size:13px;color:var(--brand-ink)}
.ttl{color:var(--dim);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.selck{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;cursor:pointer;flex:none;transition:background-color .15s ease}
.selck:hover{background:var(--brand-soft)}
.selck input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;margin:0}
.clip.picked{border-color:var(--brand)}
#selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 24px);padding:10px 12px 10px 18px;border-radius:14px;background:#150F2A;color:#FFFFFF;font-size:14px;border:1px solid var(--brand-line)}
#selbar.on{display:flex}
#selbar b{font-weight:700;margin-right:6px}
#selbar .btn{background:transparent;color:#FFFFFF;border-color:rgba(255,244,234,.25)}
#selbar .btn:hover{background:rgba(255,244,234,.1)}
#selbar .btn.primary{background:var(--brand);color:#FFFFFF;border-color:var(--brand)}
#selbar .btn.primary:hover{background:#FF54A8}
#selbar .btn.danger{color:#FF9A8F;border-color:rgba(255,154,143,.45)}
#selbar .btn.danger:hover{background:rgba(255,154,143,.14)}
.danger-card{border-color:rgba(255,77,106,.4)}
.danger-card h2{color:var(--bad)}
.clip-foot{display:flex;gap:4px;align-items:center;margin-top:auto;padding-top:8px}

/* ---------- live */
.livecard{background:var(--surface);border:1px solid rgba(255,42,84,.42);border-radius:var(--r);padding:20px;margin-bottom:28px}
.lc-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.lc-title{flex:1;min-width:0}
.lc-title h3{margin-top:8px;font-size:16px;line-height:1.4;color:var(--brand-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lc-acts{flex:none;display:flex;gap:8px;align-items:center}
.lc-acts .btn{height:40px}
@media (max-width:900px){.lc-head{flex-direction:column}.lc-acts{width:100%}.lc-acts .btn{flex:1;justify-content:center}}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin:18px 0}
.stat b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--brand-ink)}
.evbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 0;border:0;background:transparent;font:inherit;font-size:20px;font-weight:600;color:var(--brand-ink);cursor:pointer;border-radius:8px;transition:color .15s ease}
.evbtn:hover,.evpick.open .evbtn{color:var(--brand)}
.evbtn .car{width:14px;height:14px;color:var(--faint)}
.evpick .pick-menu{min-width:240px}
.pick-opt .ph{font-size:11px;color:#C2BAE0;margin-left:6px}
.stat .evpick .pick-opt .pl{font-size:13px;color:inherit}.stat .evpick .pick-opt .ph{font-size:11px;color:#C2BAE0}.stat .evpick .evbtn .pv{font-size:20px;color:inherit}
.autonote{font-size:12px;color:var(--faint);margin:-8px 0 14px}.stat span{font-size:12px;color:var(--dim)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.meter{background:var(--muted);border-radius:var(--r);padding:12px 14px}
.meter h4{font-size:12px;color:var(--dim);font-weight:600;margin-bottom:9px}
.spark{display:flex;align-items:flex-end;gap:1px;height:46px}
.spark i{flex:1;background:var(--brand);min-height:2px;border-radius:1px}.spark.chat i{background:var(--good)}
.said{font-size:13px;color:var(--faint);height:76px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.said div:last-child{color:var(--text)}

/* ---------- tables + logs */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--faint);padding:0 10px 10px;white-space:nowrap}
td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
a.lnk{color:var(--brand-ink);text-decoration:none;font-weight:600}
.log{display:flex;flex-direction:column}
.log div{display:flex;gap:14px;padding:11px 0;font-size:13px}
.log div+div{border-top:1px solid var(--line)}
.log time{color:var(--faint);white-space:nowrap;flex:none;width:118px}

/* ---------- plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{position:relative;display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line-2);cursor:pointer;font-size:13px;color:var(--dim)}
.plan b{font-size:16px;font-weight:600;color:var(--brand-ink);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.plan b svg{color:var(--brand)}
.plan em{position:absolute;top:16px;right:16px;font-style:normal;font-size:11px;font-weight:600;background:rgba(54,226,208,.16);color:#36E2D0;padding:2px 8px;border-radius:999px}
.plan input{position:absolute;opacity:0;pointer-events:none}
.plan.on{background:var(--brand-soft);border-color:var(--brand)}
.plan:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}

/* ---------- dialogs + toasts */
dialog{border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:var(--r-lg);padding:0;max-width:calc(100vw - 32px)}
dialog::backdrop{background:rgba(5,3,12,.72);animation:fadein .16s ease}
.dlg{padding:24px;width:450px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.dlg.wide{width:760px;max-width:94vw;max-height:90vh;overflow-y:auto}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.thumb-prev{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#111;display:block}
.thumb-box{position:relative;border-radius:10px;overflow:hidden}
.thumb-box.loading img{opacity:.42;filter:blur(1px);transition:opacity .2s}
.thumb-box .thumb-spin{display:none;position:absolute;inset:0;align-items:center;justify-content:center;gap:8px;background:rgba(14,12,11,.45);color:#fff;font-size:13px;font-weight:600}
.thumb-box.loading .thumb-spin{display:flex}
.thumb-alert{border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--muted)}
.thumb-alert.warn{background:rgba(245,158,11,.12);border-color:rgba(217,119,6,.4);color:#92400E}
.thumb-alert.bad{background:var(--bad-soft);border-color:rgba(220,38,38,.35);color:var(--bad)}
.thumb-alert.ok{background:rgba(16,185,129,.12);border-color:rgba(5,150,105,.38);color:#065F46}
.thumb-alert b{font-size:13px}
.thumb-alert small{opacity:.9}
.dlg h2{font-size:18px;font-weight:600;color:var(--brand-ink)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.editor{display:grid;grid-template-columns:minmax(240px,340px) minmax(300px,450px);max-height:calc(100vh - 48px)}
.editor .stage{background:#070510;display:grid;place-items:center;position:relative;min-height:320px}
.editor video,.editor .stage img{width:100%;max-height:calc(100vh - 48px);aspect-ratio:9/16;object-fit:contain;display:block}
.editor .panel{padding:22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.editor h3{font-size:13px;font-weight:600;color:var(--dim);margin-top:6px}
#darchnote:empty,#dposts:empty{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--frame);color:var(--frame-text);border:1px solid var(--frame-2);border-radius:var(--r);padding:12px 16px;max-width:380px;animation:rise .2s ease;display:flex;gap:10px;align-items:center;font-weight:500}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none}
.toast.ok::before{background:#36E2D0}.toast.bad::before{background:#FF4D6A}
.toast .rep{margin-left:auto;border:0;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.toast .rep:hover{background:rgba(255,255,255,.18)}
.err .rep{margin-left:8px;border:0;background:transparent;color:inherit;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}

.ntoast{display:flex;gap:12px;align-items:flex-start;width:340px;max-width:calc(100vw - 40px);padding:12px 12px 12px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);color:var(--text);cursor:pointer;text-align:left;
  animation:ntin .35s cubic-bezier(.2,.8,.2,1) both;transition:background-color .15s ease}
.ntoast:hover{background:#1B1433}
.ntoast.out{animation:ntout .25s ease forwards}
.ntoast i{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep)}
.ntoast i svg{width:17px;height:17px}
.ntoast.k-expiry i{background:rgba(255,184,77,.16);color:#FFD27A}.ntoast.k-post i{background:var(--bad-soft);color:#FF6B84}.ntoast.k-live i{background:rgba(255,42,84,.2);color:#FF2A54}.ntoast.k-clips i{background:var(--good-soft);color:#36E2D0}
.ntoast .tx{flex:1;min-width:0}
.ntoast b{display:block;font-size:13px;font-weight:600;color:var(--brand-ink);line-height:1.35}
.ntoast span{display:block;font-size:12px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.ntoast .x{flex:none;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer}
.ntoast .x:hover{background:var(--muted);color:var(--text)}
.ntoast .x svg{width:12px;height:12px}
@keyframes ntin{from{opacity:0;transform:translateX(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ntout{to{opacity:0;transform:translateX(24px)}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}

.me{display:flex;align-items:center;gap:8px;padding:10px 2px 0 6px;margin-top:8px;border-top:1px solid var(--frame-line)}
.me .me-pic{width:30px;height:30px;font-size:14px;object-fit:cover;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.me-btn{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:4px;margin:-4px;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left;cursor:pointer;transition:background-color .15s ease}
.me-btn:hover,.me-btn[aria-expanded=true]{background:var(--frame-2)}
.bell{position:relative}
.bell .dotn{position:absolute;top:2px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#E5323F;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--frame)}
.pop{position:fixed;z-index:60;left:248px;bottom:12px;width:360px;max-width:calc(100vw - 24px);max-height:min(520px,calc(100vh - 100px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;
  opacity:0;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease}

/* ---------- guided tour: dims the page, cuts a soft-moving hole around what each step talks about */

/* ---------- Apple iOS 26 Liquid Glass, High-Performance Compositor, Light Mode & Mobile */
body{
  background-color:var(--frame);
  background-image:
    radial-gradient(circle at 10% 12%,rgba(255,46,147,.12),transparent 42%),
    radial-gradient(circle at 90% 85%,rgba(110,57,246,.12),transparent 45%);
}
/* Glass chrome layers ONLY on floating/fixed navigation & overlay surfaces (prevents scrolling GPU readback lag) */
.side{
  background:linear-gradient(180deg,rgba(15,11,30,.92) 0%,rgba(9,6,20,.96) 100%);
  backdrop-filter:blur(18px) saturate(165%);-webkit-backdrop-filter:blur(18px) saturate(165%);
  border-right:1px solid rgba(255,255,255,.11);
}
.nav h4{color:#C8C0E4;font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:11px}
.nav-item{
  border-radius:11px;min-height:36px;color:#F2EEFF;border:1px solid transparent;
  transition:background-color .16s ease,border-color .16s ease,color .16s ease;
}
.nav-item svg{color:#CBC3E6}
.nav-item:hover{
  background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14);color:#FFFFFF;
}
.nav-item:hover svg{color:#FFFFFF}
.nav-item.on{
  background:linear-gradient(135deg,rgba(255,56,156,.94) 0%,rgba(224,17,116,.88) 58%,rgba(123,77,255,.86) 100%);
  border:1px solid rgba(255,210,235,.55);border-top-color:rgba(255,235,246,.78);
  color:#FFFFFF;font-weight:700;
}
.nav-item.on:hover{
  background:linear-gradient(135deg,rgba(255,76,168,.98) 0%,rgba(235,28,128,.92) 58%,rgba(138,92,255,.90) 100%);
}
.count{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:#FFFFFF}
.nav-item.on .count{background:rgba(8,5,18,.38);border-color:rgba(255,255,255,.28);color:#FFFFFF}
.ai-card,.side-card{
  background:linear-gradient(145deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.04) 100%);
  border:1px solid rgba(255,255,255,.14);border-top-color:rgba(255,255,255,.24);
  border-radius:12px;
}
.ai-card:hover{
  background:linear-gradient(145deg,rgba(255,255,255,.14) 0%,rgba(255,46,147,.10) 100%);

main{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 64% 44% at 18% -4%,rgba(255,46,147,.15),transparent 66%),

  border:1px solid rgba(255,255,255,.12);border-top-color:rgba(255,255,255,.20);
}

/* Topbar & Capsule Tabs (Liquid Glass) */
.topbar{
  background:rgba(16,12,32,.84);

dialog,.pop,.pick-menu,.savebar,#selbar,.toast,.ntoast,.vb,.tr-card{

/* Brand logo theme switcher */
.side-head .logo-light{display:none}
html[data-theme="light"] .side-head .logo-dark{display:none}
html[data-theme="light"] .side-head .logo-light{display:block}
html[data-theme="light"] .app.mini .side-head .logo-light{display:none}

/* Cover Builder Widget (Profile / Global Default Cover) */
.cov-box{display:grid;grid-template-columns:156px minmax(0,1fr);gap:20px;align-items:start}
.cov-prev{position:relative;width:156px;aspect-ratio:9/16;border-radius:14px;overflow:hidden;border:1px solid var(--line-2);background:#0A0716;display:grid;place-items:center}
.cov-prev img{width:100%;height:100%;object-fit:cover;display:block}
.cov-prev .cov-empty{padding:14px;text-align:center;color:var(--faint);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cov-prev .cov-empty svg{width:28px;height:28px;color:var(--brand-deep)}
.cov-prev .cov-tag{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(8,5,18,.84);color:#fff;border:1px solid rgba(255,255,255,.22)}
.cov-ctl{display:flex;flex-direction:column;gap:14px;min-width:0}
.cov-ai{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cov-ai input{flex:1 1 210px}
@media (max-width:640px){.cov-box{grid-template-columns:1fr}.cov-prev{max-width:170px;margin:0 auto}}

/* Remote QR Modal */
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.qr-card{padding:14px;border-radius:18px;background:#FFFFFF;border:1px solid rgba(255,255,255,.8);display:inline-grid;place-items:center}
.qr-card svg{width:216px;height:216px;display:block}
.qr-url{display:flex;gap:8px;width:100%;align-items:center}
.qr-url code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12.5px;padding:9px 11px;border-radius:10px;background:var(--muted);border:1px solid var(--line);color:var(--text);text-align:left}

/* Mobile Liquid Glass Bottom Dock */
.mob-dock{display:none}
@media (max-width:760px){
  .topbar.tabbed .utabs{display:none!important}
  .topbar{padding:10px 14px;gap:8px}
  .topbar #actions{gap:6px}
  .topbar #actions .btn{height:38px;min-width:38px;padding:0 11px;font-size:12.5px}
  main{padding-bottom:84px}
  .content{padding:16px 12px 96px}
  #selbar{bottom:84px}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .mob-dock{
    position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:45;
    display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border-radius:999px;
    background:linear-gradient(155deg,rgba(24,18,46,.90) 0%,rgba(12,9,24,.95) 100%);
    backdrop-filter:blur(20px) saturate(185%);-webkit-backdrop-filter:blur(20px) saturate(185%);
    border:1px solid rgba(255,255,255,.22);border-top-color:rgba(255,255,255,.38);
  }
  .mob-dock button{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    min-height:48px;border:0;border-radius:999px;background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;padding:4px 2px;
  }
  .mob-dock button svg{width:18px;height:18px}
  .mob-dock button.on{
    background:linear-gradient(135deg,rgba(255,56,156,.94) 0%,rgba(224,17,116,.88) 58%,rgba(123,77,255,.86) 100%);
    color:#FFFFFF;font-weight:700;
  }
  .mob-dock .mb-cnt{position:absolute;top:3px;right:14%;font-size:9.5px;font-weight:700;padding:0 5px;border-radius:999px;background:var(--brand);color:#fff;line-height:15px}
  .mob-dock button.on .mb-cnt{background:rgba(8,5,18,.48)}
}

      const bottom = innerHeight - (phone && s.dock !== "top" ? room : 14);

/* new notifications pop up as a small card with a soft chime */
let lastNotice = Number(localStorage.getItem("lastNotice") || 0), chimeCtx = null;
function chime() {
  try {
    chimeCtx = chimeCtx || new (window.AudioContext || window.webkitAudioContext)();
    const c = chimeCtx, now = c.currentTime;
    [[880, 0], [1318.5, .11]].forEach(([f, d]) => {         // two soft notes, A5 then E6
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + d); g.gain.linearRampToValueAtTime(.08, now + d + .015);
      g.gain.exponentialRampToValueAtTime(.0001, now + d + .5);
      o.connect(g).connect(c.destination); o.start(now + d); o.stop(now + d + .55);
    });
  } catch {}
}
function noticeToast(n) {
  const el = document.createElement("div");
  el.className = `ntoast k-${n.kind}`; el.setAttribute("role", "status");
  el.innerHTML = `<i>${ic(NT_ICON[n.kind] || "bell")}</i><span class="tx"><b>${esc(n.title)}</b>${n.body ? `<span>${esc(n.body)}</span>` : ""}</span><button class="x" aria-label="Dismiss">${ic("x")}</button>`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 250); };
  el.addEventListener("click", e => {
    close();
    if (e.target.closest(".x")) return;
    if ((n.link || "").startsWith("/app")) { const [v, tab] = fromPath(n.link); go(v, tab); } else if ((n.link || "").startsWith("/")) location.href = n.link;
  });
  $("#toasts").append(el);
  setTimeout(close, 7000);
}
async function checkNew(first) {
  if (!first && !S.status.unread) return;
  try {
    const d = await api("/api/notifications");
    const top = d.items.reduce((m, n) => Math.max(m, n.id), 0);
    if (first && !lastNotice) { lastNotice = top; localStorage.setItem("lastNotice", top); return; }   // don't replay old ones
    const fresh = d.items.filter(n => n.id > lastNotice && !n.read).reverse().slice(-3);
    if (fresh.length) { fresh.forEach(noticeToast); chime(); }
    lastNotice = Math.max(lastNotice, top); localStorage.setItem("lastNotice", lastNotice);
  } catch {}
}

async function lookUp(u) {

// A big file goes in pieces (anything standing in front of the app refuses one huge request), two at a time,
// and a piece that fails is simply sent again. The bar shows the whole file.
async function sendBig(f, who, options) {
  const file = f.file;
  const s = await send("/api/upload/start", {name: file.name, size: file.size, options, creator: who});
  const sent = new Array(s.parts).fill(0);
  const show = () => { f.pct = Math.min(99, Math.round(sent.reduce((a, b) => a + b, 0) / file.size * 100)); drawAtt(); };
  const put = i => new Promise((ok, fail) => {
    const x = new XMLHttpRequest();
    x.open("PUT", `/api/upload/${s.id}/${i}`);
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = e => { sent[i] = e.loaded; show(); };
    x.onload = () => {
      if (x.status === 401) { location.href = "/login"; return; }
      if (x.status >= 200 && x.status < 300) { sent[i] = Math.min(s.part, file.size - i * s.part); show(); return ok(); }
      let d = "Upload failed"; try { d = JSON.parse(x.responseText).detail || d; } catch {}
      const err = new Error(typeof d === "string" ? d : "Upload failed"); err.final = x.status >= 400 && x.status < 500 && x.status !== 408 && x.status !== 429; fail(err);
    };
    x.onerror = x.ontimeout = () => fail(new Error("Upload failed. Check your connection."));
    x.send(file.slice(i * s.part, Math.min(file.size, (i + 1) * s.part)));
  });

  const worker = async () => {
    while (next < s.parts) {
      const i = next++;
      for (let tries = 0; ; tries++) {
        try { await put(i); break; }
        catch (e) { sent[i] = 0; if (e.final || tries >= 3) throw e; await new Promise(r => setTimeout(r, 1500 * (tries + 1))); }
      }
    }
  };
  try {
    await Promise.all([worker(), worker()]);
    await send(`/api/upload/${s.id}/finish`, {});
    f.pct = 100; drawAtt();
  } catch (e) {
    next = s.parts;                                   // stop the other sender
    api(`/api/upload/${s.id}`, {method: "DELETE"}).catch(() => {});
    throw e;
  }
}

function jobHtml(j) {

const sel = () => (S.sel = S.sel || new Set());
function selParts() {
  const jobsSel = [], clipsSel = [];

  return {jobsSel, clipsSel};
}
function selClips() {          // every finished clip the selection covers, for downloading
  const {jobsSel, clipsSel} = selParts(), out = new Map();
  jobsSel.forEach(id => (jobOf(id)?.clips || []).forEach(c => { if (c.status === "done") out.set(id + "." + c.id, 1); }));
  clipsSel.forEach(([j, c]) => { if (jobOf(j)?.clips.find(x => x.id === c)?.status === "done") out.set(j + "." + c, 1); });
  return [...out.keys()];
}

function jobSig(j) {

function drawJobs() {
  const root = $("#jobs"); if (!root) return;
  const cid = creatorId();
  let list = cid ? S.jobs.filter(j => j.creator === cid) : S.jobs;
  const liveBox = $("#live");
  if (liveBox) { const lj = list.find(j => j.status === "live");
    if (!liveBox.querySelector(".pick.open")) put(liveBox, lj ? liveHtml(lj) : "");
    list = list.filter(j => j.status !== "live"); }
  if (!list.length) {
    root.innerHTML = `<div class="empty"><img src="/brand/favicon.svg?v=vc4" alt=""><b>${cid ? "No clips for this creator yet" : "No videos yet"}</b>${cid ? "Start recording their stream, or paste a link to one of their videos above." : "Paste a link above and the studio will find the best moments and turn them into clips."}</div>`;
    return;
  }
  $(".empty", root)?.remove();
  const lim = S.jobsLimit || 16;
  const vis = list.slice(0, lim);
  const ids = new Set(vis.map(j => j.id));
  $$("section[data-job]", root).forEach(el => { if (!ids.has(el.dataset.job)) el.remove(); });
  vis.forEach((j, i) => {
    let el = $(`section[data-job="${j.id}"]`, root);
    if (!el) { el = document.createElement("section"); el.className = "job"; el.dataset.job = j.id; }
    if (root.children[i] !== el) root.insertBefore(el, root.children[i] || null);

  });
  let more = $("#jobsMore", root);
  if (list.length > vis.length) {
    if (!more) { more = document.createElement("div"); more.id = "jobsMore"; more.className = "row"; more.style.justifyContent = "center"; more.style.marginTop = "16px"; }
    more.innerHTML = `<button class="btn" type="button" data-act="morejobs">Mostrar mais vídeos (${list.length - vis.length} restantes)</button>`;

}

function barChart(daily) {
  const W = 720, H = 230, pl = 30, pb = 28, pt = 12, n = daily.length, ch = H - pt - pb;
  const peak = Math.max(1, ...daily.map(d => Math.max(d.clips, d.posted)));
  const step = Math.max(1, Math.ceil(peak / 4)), top = step * 4, cw = (W - pl) / n, bw = Math.min(14, (cw - 10) / 2);
  const y = v => pt + ch * (1 - v / top);
  let g = "";
  for (let i = 0; i <= 4; i++) g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(i * step)}" y2="${y(i * step)}"/><text x="${pl - 8}" y="${y(i * step) + 4}" text-anchor="end">${i * step}</text>`;
  daily.forEach((d, i) => {
    const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString("pt-BR", {day:"numeric", month:"short"});
    g += `<g><title>${lab}: ${d.clips} clipes feitos, ${d.posted} postados${d.views ? ", " + d.views.toLocaleString() + " visualizações" : ""}</title>
      <rect class="b1" x="${cx - bw - 1}" y="${y(d.clips)}" width="${bw}" height="${Math.max(0, ch * d.clips / top)}" rx="3"/>
      <rect class="b2" x="${cx + 1}" y="${y(d.posted)}" width="${bw}" height="${Math.max(0, ch * d.posted / top)}" rx="3"/>
      <rect x="${pl + i * cw}" y="${pt}" width="${cw}" height="${ch}" fill="transparent"/></g>`;
    if (i % 2 === (n - 1) % 2) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${i === n - 1 ? "Hoje" : lab}</text>`;
  });
  const none = daily.every(d => !d.clips && !d.posted) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">Nenhum clipe nos últimos 14 dias ainda</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Clipes feitos e postados por dia nos últimos 14 dias">${g}${none}</svg>`;
}
function nextSteps(o) {
  const st = [];

  if (!S.jobs.length) st.push(["Faça seus primeiros clipes", "Cole um link de vídeo na caixa acima.", "focusurl"]);
  if (!S.accounts.length) st.push(["Conecte uma conta para postar", "YouTube, Instagram ou TikTok em um clique.", "go:settings"]);
  if (S.creators.length && !S.creators.some(c => c.auto_watch)) st.push(["Ative a gravação automática", "Grava sozinho sempre que o criador entrar ao vivo.", "go:c:" + S.creators[0].id + ":setup"]);

}

function tokenChart(daily) {
  const W = 1000, H = 220, pl = 64, pb = 26, pt = 10, n = daily.length, ch = H - pt - pb;
  const peak = Math.max(...daily.map(d => d.tokens), 1), top = peak * 1.15, cw = (W - pl) / n, bw = Math.min(14, cw - 6);
  const y = v => pt + ch * (1 - v / top);
  let g = "";
  for (let i = 0; i <= 3; i++) { const v = top * i / 3; g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${fmtK(Math.round(v))}</text>`; }
  daily.forEach((d, i) => {
    const cx = pl + i * cw + cw / 2, lab = new Date(d.day + "T12:00").toLocaleDateString([], {day:"numeric", month:"short"});
    g += `<g><title>${lab}: ${d.tokens.toLocaleString()} tokens in ${d.calls} call${d.calls === 1 ? "" : "s"}</title><rect class="b1" x="${cx - bw / 2}" y="${y(d.tokens)}" width="${bw}" height="${Math.max(0, ch * d.tokens / top)}" rx="3"/></g>`;
    if ((n - 1 - i) % 5 === 0) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${i === n - 1 ? "Today" : lab}</text>`;
  });
  const none = daily.every(d => !d.tokens) ? `<text class="none" x="${(W + pl) / 2}" y="${pt + ch / 2}" text-anchor="middle">No AI used in the last 30 days</text>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="AI tokens used per day, last 30 days">${g}${none}</svg>`;
}

}

function aiEffectiveChecks(k) {

  }

}
function aiMergeChecks(baseChecks, liveChecks) {

    if (b.state === "untested" || b.state === "incomplete" || ((m.at || 0) >= (b.at || 0))) return {...b, ...m, order: b.order};
    return b;

function classifyClientThumbError(err) {
  const msg = String(err?.message || err || "");
  const low = msg.toLowerCase();
  if (low.includes("failed to fetch") || low.includes("networkerror") || low.includes("network") || low.includes("load failed")) {
    return {
      category: "connection",
      title: "Sem conexão com o servidor do VICE CUT AI",
      message: "Não foi possível falar com o servidor para gerar a nova thumbnail.",
      action: "Confira se o servidor (ou túnel Cloudflare) continua rodando e tente novamente."
    };
  }
  if (msg.includes("429") || low.includes("too many") || low.includes("minute") || low.includes("limite")) {
    return {
      category: "rate_limit",
      title: "Muitas tentativas em sequência",
      message: "Você gerou várias thumbnails muito rápido e atingiu a proteção temporária de limite.",
      action: "Aguarde alguns segundos e clique em \"Gerar nova imagem\" novamente."
    };
  }
  if (msg.includes("409") || low.includes("still being made") || low.includes("rendering")) {
    return {
      category: "busy",
      title: "Clipe ainda em processamento",
      message: "Este clipe está sendo renderizado neste momento.",
      action: "Espere o clipe terminar de renderizar e tente gerar a imagem novamente."
    };
  }
  if (low.includes("500") || low.includes("502") || low.includes("503") || low.includes("unavailable")) {
    return {
      category: "server_error",
      title: "Servidor temporariamente indisponível",
      message: "O servidor encontrou uma falha momentânea ao montar a nova imagem.",
      action: "Tente clicar em \"Gerar nova imagem\" novamente em instantes."
    };
  }
  return {
    category: "api_error",
    title: "Não foi possível gerar a nova imagem",
    message: msg || "Ocorreu um erro inesperado ao tentar criar esta thumbnail.",
    action: "Tente novamente ou altere entre o modo Local e IA."
  };
}
function renderThumbNotice(rep, fallbackShow = false) {

      <b>${esc(e.title || "Aviso na geração da thumbnail")}</b>

async function tick() {
  try {
    const got = await api("/api/sync?v=" + encodeURIComponent(S.syncV || ""));
    const fresh = !!got.jobs, stale = Date.now() - (S.ovAt || 0) > 15000;
    S.syncV = got.v;
    if (!fresh) {
      if ((S.view === "overview" || PLAT_VIEWS.includes(S.view)) && stale) { S.overview = await api("/api/overview"); S.ovAt = Date.now(); render(); }
      return;
    }
    const {jobs, creators, accounts} = got;
    // a server from before multi-channel support sends only `channel`: show it as that platform's channel
    creators.forEach(c => { if (!c.channels) { const u = c.channel || "", k = /youtu/i.test(u) ? "youtube" : /twitch/i.test(u) ? "twitch" : /kick/i.test(u) ? "kick" : ""; c.channels = k ? {[k]: u} : {}; } });
    S.jobs = jobs; S.creators = creators; S.accounts = accounts;
    if (got.ai) S.status.ai = got.ai;
    if (got.gdrive) S.status.gdrive = got.gdrive;
    if (got.unread != null) S.status.unread = got.unread;
    if ((S.view === "overview" || PLAT_VIEWS.includes(S.view)) && (Date.now() - (S.ovAt || 0) > 10000 || !S.overview)) { S.overview = await api("/api/overview"); S.ovAt = Date.now(); }
    if (creatorId() && !creator()) return go("overview");
    render();
  } catch {}
}
// Back on the tab (or window): ask straight away instead of waiting out the slow background timer, and put a
// live player that fell behind while hidden back at the live edge.
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  tick();
  if (hiddenAt && Date.now() - hiddenAt > 60000) {   // away a while: jump back to the live moment
    const pl = $("#stream .player"), f = pl?.querySelector("iframe");
    if (f) { const src = f.src; f.src = "about:blank"; requestAnimationFrame(() => { f.src = src; }); }
  }
  hiddenAt = 0;
});

function loop() {
  const active = S.jobs.some(j => ["queued", "running", "live"].includes(j.status) || j.clips.some(c => c.status === "queued" || c.status === "rendering"))
    || S.status?.gdrive?.queued > 0;
  // quick while something is being made, relaxed otherwise, and slow when the tab is in the background
  const waiting = S.creators.some(c => (c.channels && Object.keys(c.channels).length && !c.profile?.pic) || c.live_job && !jobOf(c.live_job));
  setTimeout(async () => { await tick(); loop(); }, document.hidden ? 20000 : waiting ? 1000 : active ? 2000 : 4000);
}

    }
    if (a === "storsave") {
      const s = await send("/api/storage", {path: $("#stor_new").value, move: $("#stor_move").checked}, "PUT");
      S.storOpen = false; toast("Saved. Close VICE CUT AI and start it again to switch to the new folder.", "ok"); return drawSettings();
    }
    if (a === "storcancel") { await send("/api/storage", {cancel: true}, "PUT"); toast("Kept the current folder", "ok"); return drawSettings(); }
    if (a === "gdappsetup") { S.gdSetupOpen = !S.gdSetupOpen; return drawSettings(); }
    if (a === "gdappsave") {
      b.disabled = true;
      try {
        await send("/api/apps", {platform: "youtube", client_id: $("#gd_app_id").value, client_secret: $("#gd_app_secret").value}, "PUT");
        S.gdSetupOpen = false; S.status = await api("/api/status"); toast("Saved. You can connect Google Drive now.", "ok"); return drawSettings();
      } finally { b.disabled = false; }
    }
    if (a === "gdsave") {
      b.disabled = true;
      try {
        const raw = $("#gd_days").value.trim(), days = raw === "" ? 0 : Number(raw);
        if (!Number.isFinite(days)) throw new Error("Choose a number of days between 0 and 365.");
        const gd = await send("/api/gdrive", {auto_after_post: $("#gd_after_post").checked, auto_days: Math.round(days)}, "PUT");
        S.gd = gd; S.status.gdrive = {ready: gd.ready, connected: gd.connected, queued: gd.queued || 0};
        toast("Google Drive settings saved", "ok"); return drawSettings();
      } finally { b.disabled = false; }
    }
    if (a === "gddisconnect") {
      if (!await ask("Disconnect Google Drive?", "Clips already on Google Drive stay there, and new clips will stay on this computer until you connect again.", "Disconnect", true)) return;
      b.disabled = true;
      try {
        await api("/api/gdrive", {method: "DELETE"});
        S.status = await api("/api/status"); render(); toast("Google Drive disconnected", "ok"); return drawSettings();
      } finally { b.disabled = false; }
    }
    if (a === "gdsweep") {
      b.disabled = true;
      try {
        const r = await send("/api/gdrive/sweep");
        if (r.gdrive) S.status.gdrive = {ready: r.gdrive.ready, connected: r.gdrive.connected, queued: r.gdrive.queued || 0};
        const parts = [
          r.queued ? `${r.queued} clip${r.queued === 1 ? "" : "s"} queued for Google Drive` : "",
          r.cleaned ? `${r.cleaned} raw video${r.cleaned === 1 ? "" : "s"} cleaned up` : ""
        ].filter(Boolean);
        toast(parts.length ? parts.join(" · ") + "." : "Everything eligible is already archived.", "ok");
        await tick(); return drawSettings();
      } finally { b.disabled = false; }
    }
    if (a === "gdclip") {
      b.disabled = true;
      try {
        const r = await send(`/api/jobs/${encodeURIComponent(d.j)}/clips/${encodeURIComponent(d.c)}/archive`);
        toast(r.queued === false ? "Already archiving to Google Drive…" : "Archiving clip to Google Drive…", "ok");
        setTimeout(() => { if (b.isConnected) b.disabled = false; }, 2000);
        return tick();
      } catch (err) { b.disabled = false; throw err; }
    }
    if (a === "appsetup") { S.setupOpen = d.p && S.setupOpen !== d.p ? d.p : ""; return drawSettings(); }
    if (a === "copytext") { await navigator.clipboard.writeText(d.t); return toast("Copied", "ok"); }
    if (a === "appsave") {
      const payload = {platform: d.p, client_id: $("#app_id").value, client_secret: $("#app_secret").value};
      if (d.p === "instagram") { payload.mode = $("#app_mode")?.value || "fb"; payload.config_id = $("#app_cfg_id")?.value || ""; }
      await send("/api/apps", payload, "PUT");
      S.setupOpen = ""; S.status = await api("/api/status"); toast("Saved. People can connect now.", "ok"); return drawSettings();
    }
    if (a === "igtoken") {
      const dlg = $("#formdlg");
      dlg.innerHTML = `<form method="dialog" class="dlg"><h2>Connect Instagram with token</h2>
        <p class="help">Paste a System User or access token generated in Meta for Developers (Unified Login) or Instagram API setup.</p>
        <label class="f">Access token<input id="ig_tok_inp" type="password" autocomplete="off" spellcheck="false" required></label>
        <div class="dlg-foot"><button class="btn" value="no" formnovalidate>Cancel</button><button class="btn primary" value="yes">Connect</button></div></form>`;
      dlg.onclose = async () => {
        if (dlg.returnValue !== "yes") return;
        try { const acc = await send("/api/accounts/instagram/token", {token: $("#ig_tok_inp").value}); await tick(); drawSettings(); toast(`${acc.name} connected`, "ok"); }
        catch (err) { toast(err.message, "bad"); }
      };
      dlg.returnValue = "no"; return dlg.showModal();
    }
    if (a === "bell") return openBell();
    if (a === "feedback") return openFeedback("bug");
    if (a === "report") return openFeedback("bug", d.ctx);
    if (a === "acctmenu") return openAcct();
    if (a === "bellread") { await markRead(); return openBell().then(openBell); }
    if (a === "ntgo") { closePops(); const l = d.link || ""; if (l.startsWith("/app")) { const [v, tab] = fromPath(l); return go(v, tab); } if (l.startsWith("/")) location.href = l; return; }
    if (a === "csave") return void await saveCreator();
    if (a === "cdiscard") { drawCreatorForm(); return toast("Changes discarded"); }
    if (a === "pause") { await send("/api/settings", {paused:!S.overview.paused}, "PUT"); return loadOverview(); }
    if (a === "pauseplat") {
      const cur = Array.isArray(S.overview?.paused_platforms) ? [...S.overview.paused_platforms] : [];
      const next = cur.includes(d.p) ? cur.filter(x => x !== d.p) : [...cur, d.p];
      await send("/api/settings", {paused_platforms: next}, "PUT");
      return loadOverview();
    }
    if (a === "ovgroup") { S.ov.group = !S.ov.group; S.ov.limit = 60; return drawOverview(); }
    if (a === "ovclear") { S.ov = {...S.ov, creator:"", platform:"", status:"", format:"", limit:60}; return drawOverview(); }
    if (a === "ovmore") { S.ov.limit = (S.ov.limit || 60) + 60; return drawOverview(); }
    if (a === "qctrl") return openQueueCtrlDlg();
    if (a === "qpreset") {
      await send("/api/queue/config", {preset: d.m || "weekend"}, "PUT");
      toast(`Ritmo ${d.m === "turbo" ? "Turbo" : d.m === "normal" ? "Padrão" : "Fim de Semana"} aplicado e fila recalculada!`, "ok");
      await loadOverview();
      return openQueueCtrlDlg();
    }
    if (a === "qsave") {
      const patch = {};
      $$("#qcfgform [data-qc]").forEach(i => { patch[i.dataset.qc] = Number(i.value || 0); });
      if (patch.short_gap_min >= 10 || patch.short_daily_cap > 0 || patch.short_period_cap !== 2 || patch.long_daily_cap !== 2) patch.strict_floor = false;
      await send("/api/queue/config", patch, "PUT");
      toast("Ritmo da fila atualizado e agendamentos recalculados!", "ok");
      await loadOverview();
      return openQueueCtrlDlg();
    }
    if (a === "qboost") {
      const payload = {sync_reels: !!$("#q_sync_reels")?.checked};
      $$("#qboostform [data-qb]").forEach(i => { payload[i.dataset.qb] = Number(i.value || 0); });
      const res = await send("/api/queue/boost", payload, "POST");
      toast(`Distribuídos ${res?.boost?.boosted_total || 0} envios na fila de hoje!`, "ok");
      await loadOverview();
      return openQueueCtrlDlg();
    }
    if (a === "pcancel" || a === "pretry") { await api(`/api/posts/${d.id}/${a === "pcancel" ? "cancel" : "retry"}`, {method:"POST"}); return loadOverview(); }
    if (a === "copycap") {
      const p = (S.overview?.posts || []).find(x => x.id === d.id);
      const txt = p?.caption_ready || $(`[data-captext="${d.id}"]`)?.value || "";
      if (!txt) return toast("Sem legenda disponível ainda.", "bad");
      await navigator.clipboard.writeText(txt);
      return toast("Legenda completa e #hashtags copiadas!", "ok");
    }
    if (a === "copytags") {
      await navigator.clipboard.writeText(d.t || "");
      return toast("Hashtags copiadas!", "ok");
    }
    if (a === "platcfgsave") {
      const plat = d.p, pref = {};
      $$("#platcfg [data-pk]").forEach(i => {
        pref[i.dataset.pk] = i.type === "checkbox" ? i.checked : i.type === "number" ? Number(i.value) : i.value;
      });
      await send("/api/settings", {platform_prefs: {[plat]: pref}}, "PUT");
      toast(`Configurações de ${PLAT_LABEL[plat] || plat} salvas!`, "ok");
      return loadOverview();
    }
    if (a === "ppostnow") {
      if (!await ask("Enviar este clipe agora?", "A postagem será disparada imediatamente para esta plataforma.", "Enviar agora")) return;
      if (d.id) await api(`/api/posts/${d.id}/cancel`, {method:"POST"});
      await send("/api/posts", {job: d.j, clip: d.c, accounts: [d.acc], now: true});
      toast("Envio imediato disparado!", "ok");
      return loadOverview();
    }
    if (a === "pcancelbulk" || a === "pretrybulk") {
      const act = a === "pcancelbulk" ? "cancel" : "retry";
      for (const id of String(d.ids || "").split(",").filter(Boolean)) await api(`/api/posts/${id}/${act}`, {method:"POST"});
      return loadOverview();
    }
    if (a === "ssave") { await saveSettings(); toast("Saved", "ok"); return drawSettings(); }
    if (a === "plansave") {
      const p = {}; $$("#sform [data-plan]").forEach(i => { (p[i.dataset.plan] ??= {})[i.dataset.f] = Number(i.value); });
      await send("/api/settings", {plans:p}, "PUT"); S.status = await api("/api/status"); toast("Plans saved", "ok"); return drawSettings();
    }
    if (a === "testalert") { await saveSettings(); await api("/api/alerts/test", {method:"POST"}); return toast("Test message sent. Check your phone.", "ok"); }
    if (a === "accremove") {
      if (!await ask("Disconnect this account?", "Posts still waiting for it will fail.", "Disconnect", true)) return;
      await api(`/api/accounts/${d.id}`, {method:"DELETE"}); await tick(); return drawSettings();
    }
    if (a === "makethumb") {
      b.disabled = true;
      const box = $("#dthumbbox"), notice = $("#dthumbnotice"), metaEl = $("#dthumbmeta");
      if (box) box.classList.add("loading");
      b.innerHTML = `<i class="btn-spin"></i>Gerando nova imagem…`;
      let nextLabel = "Gerar nova imagem";
      try {
        const thumb_text = $("#clipdlg [data-f='thumb_text']")?.value || "";
        const thumb_mode = $("#clipdlg [data-f='thumb_mode']")?.value || "local";
        const updated = await send(`/api/jobs/${encodeURIComponent(D.jid)}/clips/${encodeURIComponent(D.cid)}/thumb`, {thumb_text, thumb_mode, new_variant: true});
        const uc = updated?.clips?.find(x => x.id === D.cid);
        const rep = updated?.thumb_report || uc?.thumb_meta || null;
        const ti = $("#dthumbimg");
        if (ti && uc?.cover) ti.src = `/media/${encodeURIComponent(D.jid)}/${encodeURIComponent(uc.cover)}?v=${uc.version}&t=${Date.now()}`;
        if (metaEl) metaEl.textContent = thumbMetaLine(uc, rep);
        if (notice) notice.innerHTML = renderThumbNotice(rep);
        if (rep?.fallback && rep?.error?.title) toast(rep.error.title, "bad");
        else toast(`Nova imagem gerada${rep?.variant ? ` (variação #${rep.variant})` : ""}!`, "ok");
        await tick();
      } catch (err) {
        const cerr = classifyClientThumbError(err);
        if (notice) notice.innerHTML = renderThumbNotice({error: cerr, fallback: false}, true);
        toast(cerr.title, "bad");
      } finally {
        if (box) box.classList.remove("loading");
        if (document.body.contains(b)) { b.disabled = false; b.innerHTML = `${ic("play")}${nextLabel}`; }
      }
      return;
    }
    if (a === "remake") {
      const body = {}; $$("#clipdlg [data-f]").forEach(i => {
        body[i.dataset.f] = i.type === "checkbox" ? i.checked : i.type === "number" ? Number(i.value) : i.value;
      });
      await send(`/api/jobs/${D.jid}/clips/${D.cid}/render`, body); toast("Re-making the clip…", "ok"); return tick();
    }
    if (a === "postnow" || a === "postqueue") {
      const accs = $$("#clipdlg [data-pacc]:checked").map(i => i.value);
      if (!accs.length) return toast("Tick at least one account first.", "bad");
      if (a === "postnow" && !await ask("Post now?", `This clip goes to ${accs.length} account${accs.length > 1 ? "s" : ""} straight away.`, "Post now")) return;
      await send("/api/posts", {job:D.jid, clip:D.cid, accounts:accs, now:a === "postnow"});
      toast(a === "postnow" ? "Posting now" : "Added to the queue", "ok"); return tick();
    }
  } catch (err) { b.disabled = false; toast(err.message, "bad"); }
});

$("#collapseBtn").innerHTML = ic("sidebar"); $("#menuBtn").innerHTML = ic("menu");
document.addEventListener("change", e => {
  const s = e.target.closest?.("[data-ovf]");
  if (!s) return;
  S.ov[s.dataset.ovf] = s.value;
  S.ov.limit = 60;
  drawOverview();
});
try { if (localStorage.getItem("mini")) $("#app").classList.add("mini"); } catch {}
$("#main").addEventListener("scroll", () => $(".topbar").classList.toggle("stuck", $("#main").scrollTop > 4), {passive:true});
(async () => {
  try { S.status = await api("/api/status"); } catch {}
  const q = new URLSearchParams(location.search);
  if (q.get("connected") || q.get("connect_error")) {
    const ok = q.get("connected"), err = q.get("connect_error"), nm = q.get("name");
    history.replaceState(null, "", location.pathname);
    setTimeout(() => ok ? toast(`${nm || ok} is connected. Pick it in a creator's Setup to post there.`, "ok") : toast(err, "bad"), 300);
  }
  if (q.get("gdrive_connected") || q.get("gdrive_error")) {
    const ok = q.get("gdrive_connected"), err = q.get("gdrive_error");
    history.replaceState(null, "", location.pathname);
    setTimeout(() => ok ? toast(`Google Drive${ok !== "1" ? " (" + ok + ")" : ""} is connected. Clips will archive there automatically.`, "ok") : toast(err, "bad"), 300);
  }
  if (q.get("verified")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast("Email confirmed. You're ready to clip.", "ok"), 300); }
  if (q.get("verify_error")) { history.replaceState(null, "", location.pathname); setTimeout(() => toast(q.get("verify_error"), "bad"), 300); }
  if (location.pathname.startsWith("/app/")) { const [v, tab] = fromPath(location.pathname); S.view = v; S.ctab = tab; }  // the address decides, before anything loads
  await tick();
  { const [v, tab] = location.pathname.startsWith("/app/") ? fromPath(location.pathname) : ["overview", "clips"]; go(v, tab, true); remember(S.view, S.ctab, "replace"); }
  try {  // a link pasted on the home page before signing up
    const link = sessionStorage.getItem("peakcut_link");
    if (link) { sessionStorage.removeItem("peakcut_link"); go("overview"); $("#url").value = link; onLink($("#url")); $("#url").focus(); toast("Your link is ready. Press Make clips.", "ok"); }
  } catch {}
  loop();
  if (S.status.tour && !$("#formdlg").open) setTimeout(startTour, 500);   // once, the first time someone signs in
  checkNew(true);
  setInterval(async () => { if (document.hidden) return; try { S.status = await api("/api/status"); drawShell(); checkNew(); } catch {} }, 20000);
})();
</script>
</body>
</html>
